[package]
name = "agent-types"
description = "Agent-chain header, block and transaction types with the SPEC v2 fixed binary encoding"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
commonware-codec.workspace = true
commonware-cryptography.workspace = true
blake3.workspace = true
primitive-types.workspace = true
thiserror.workspace = true
bytes = "1"
ed25519-dalek = "2.2"
sha2 = "0.10"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json.workspace = true
hex.workspace = true
bs58.workspace = true
# sealed DM reference + vectors (tests/dm_crypto.rs only; the chain never decrypts)
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
hmac = "0.12"
