# Extra for the native Rust services that never generate code at run time (header-relay,
# cadre-settle, pearl-attester, cadre-gateway). NOT for agent-node / pearl-miner (a WASM contract
# VM with a JIT is being added to the node) and NOT for Node.js or Python (V8 JIT).
[Service]
MemoryDenyWriteExecute=yes
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
