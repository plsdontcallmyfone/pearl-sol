# Cadre devnet: sandbox for every cadre-* unit (docs/DEVNET.md "Ops hardening").
# Installed as /etc/systemd/system/<unit>.d/10-hardening.conf. Services run as `lode` already;
# they read /etc/lode, /opt/lode, /home/lode (code, node, venv) and write only /var/lib/lode.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/var/lib/lode
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictSUIDSGID=yes
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
UMask=0077
