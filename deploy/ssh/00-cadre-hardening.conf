# Cadre devnet boxes: key-only ssh (docs/DEVNET.md "Ops hardening").
# Named 00- so it wins over 50-cloud-init.conf (sshd keeps the first value it reads).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
