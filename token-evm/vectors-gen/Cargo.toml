[package]
name = "cadre-evm-vectors"
version = "0.1.0"
edition = "2021"
license = "ISC"
description = "Writes token-evm/test/vectors/*.json from the Rust references (commonware-storage MMR, crates/pearl-verify-sbf) for the Solidity tests"
publish = false

# Standalone (own workspace), like crates/pearl-verify-sbf.
[workspace]

[dependencies]
pearl-verify-sbf = { path = "../../crates/pearl-verify-sbf" }
commonware-storage = "=2026.9.0"
commonware-cryptography = "=2026.9.0"
commonware-codec = "=2026.9.0"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
