[package]
name = "storefront"
version = "0.1.0"
description = "pearl-sol compute storefront (SPEC 5.1)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "storefront"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "lightclient/idl-build"]


[dependencies]
anchor-lang = "0.31.1"
lightclient = { path = "../lightclient", features = ["no-entrypoint"] }
pearl-verify-sbf = { path = "../../../crates/pearl-verify-sbf" }

