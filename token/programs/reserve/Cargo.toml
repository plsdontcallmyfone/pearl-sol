[package]
name = "reserve"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "reserve"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# public devnet program id (docs/DEVNET.md)
devnet = []
# Solana mainnet program id (docs/MAINNET.md; keypair in ~/.config/pearl-sol/keys-mainnet, never in a repo)
mainnet = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = "0.31.1"

