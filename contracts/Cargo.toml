# Cadre trading contracts (docs/TRADING.md): a constant-product AMM (CADRE against any token
# contract) and the Cadre-native mandate (user-owned trading accounts, the agent can only swap).
# Built for wasm32-unknown-unknown on the contract SDK, like crates/cadre-contract-sdk/examples.
# Tests that run them in the real executor are in contracts/tests (a separate host workspace).
[workspace]
members = ["amm", "mandate", "market", "halt", "poolprobe", "strategies", "swarms", "toolbelt"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "ISC"
version = "0.1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
panic = "abort"
