[package]
name = "header-relay"
version = "0.1.0"
edition = "2021"
license = "ISC"
description = "Permissionless relay: follows the agent-chain node (RPC 10630) and pushes headers + Pearl proofs into the Solana light client (token/programs/lightclient). Also: init, devnet seeding and fixture harvest."

# Standalone (own workspace): pulls solana-client.
[workspace]

[lib]
name = "header_relay"
path = "src/lib.rs"

[[bin]]
name = "header-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
bs58 = "0.5"
base64 = "0.22"
sha2 = "0.10"
blake3 = "1.8"
rand = "0.9"
ed25519-dalek = "2.2"
solana-client = "2.2"
solana-sdk = "2.2"
solana-account-decoder-client-types = "2.2"
anchor-lang = "0.31.1"
lightclient = { path = "../../token/programs/lightclient", features = ["no-entrypoint"] }
pearl-verify-sbf = { path = "../../crates/pearl-verify-sbf" }
pearl-node = { path = "../../crates/pearl-node" }
pearl-job = { path = "../../crates/pearl-job" }

[features]
# public devnet program ids (docs/DEVNET.md)
devnet = ["lightclient/devnet"]

[profile.release]
opt-level = 3

[dev-dependencies]
litesvm = "0.6.1"
lightclient-litesvm-tests = { path = "../../token/tests/lightclient-litesvm" }
