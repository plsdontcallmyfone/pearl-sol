[package]
name = "pearl-attester"
description = "Attester: Freivalds-checks delivered results against jobs read from the v2 node and signs the SPEC v2 4.1 Result message (v1 share mode kept)"
edition = "2021"
license = "ISC"
version = "0.1.0"
workspace = "../../crates"

[lib]
name = "pearl_attester"

[[bin]]
name = "pearl-attester"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
bs58.workspace = true
base64.workspace = true
rand.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
tiny_http.workspace = true
pearl-job.workspace = true
pearl-chain.workspace = true
pearl-node.workspace = true
